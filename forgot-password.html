<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#FF6B35"
>

<title>Forgot Password - KEEVO</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f5f6f8;
    color:#181a1f;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:430px;
}

.logo{
    text-align:center;
    font-size:30px;
    font-weight:900;
    margin-bottom:8px;
}

.logo span{
    color:#FF6B35;
}

.subtitle{
    text-align:center;
    color:#777;
    font-size:14px;
    line-height:1.5;
    margin-bottom:25px;
}

.card{
    background:white;
    border-radius:20px;
    padding:25px 20px;
    box-shadow:0 6px 25px rgba(0,0,0,.06);
}

.icon{
    width:65px;
    height:65px;
    border-radius:50%;
    background:#fff0e9;
    display:flex;
    align-items:center;
    justify-content:center;
    margin:0 auto 18px;
    font-size:28px;
}

h1{
    text-align:center;
    font-size:22px;
    margin-bottom:8px;
}

.description{
    text-align:center;
    color:#777;
    font-size:13px;
    line-height:1.5;
    margin-bottom:22px;
}

label{
    display:block;
    font-size:13px;
    font-weight:700;
    margin-bottom:7px;
}

input{
    width:100%;
    padding:13px;
    border:1px solid #ddd;
    border-radius:11px;
    outline:none;
    font-size:14px;
    margin-bottom:14px;
}

input:focus{
    border-color:#FF6B35;
}

.reset-btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    background:#FF6B35;
    color:white;
    font-size:14px;
    font-weight:800;
    cursor:pointer;
}

.reset-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.message{
    display:none;
    padding:13px;
    border-radius:11px;
    font-size:13px;
    line-height:1.5;
    margin-bottom:15px;
}

.success{
    background:#eefaf1;
    color:#26733b;
}

.error{
    background:#fff1f1;
    color:#c62828;
}

.back-login{
    display:block;
    text-align:center;
    margin-top:18px;
    color:#FF6B35;
    text-decoration:none;
    font-size:13px;
    font-weight:700;
}

</style>

</head>


<body>


<div class="container">


    <div class="logo">
         KEEVO
    </div>


    <p class="subtitle">
        Keep every bill safe.
    </p>


    <div class="card">


        <div class="icon">
            🔐
        </div>


        <h1>
            Forgot Password?
        </h1>


        <p class="description">
            Enter your registered email address
            and we'll send you a password reset link.
        </p>


        <!-- SUCCESS MESSAGE -->

        <div
            id="successMessage"
            class="message success"
        ></div>


        <!-- ERROR MESSAGE -->

        <div
            id="errorMessage"
            class="message error"
        ></div>


        <!-- FORM -->

        <form id="resetForm">


            <label for="email">
                Email Address
            </label>


            <input
                type="email"
                id="email"
                placeholder="Enter your registered email"
                autocomplete="email"
                required
            >


            <button
                type="submit"
                class="reset-btn"
                id="resetButton"
            >
                Send Reset Link
            </button>


        </form>


        <a
            href="login.html"
            class="back-login"
        >
            ← Back to Login
        </a>


    </div>


</div>


<script>

/* =================================
   SUPABASE
================================= */

const SUPABASE_URL =
    "https://fuymbbdnahkxnztlvdfr.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_OYnSR2D-1qDsyaeyxf6gzA_Odjs6Za3";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


/* =================================
   ELEMENTS
================================= */

const resetForm =
    document.getElementById(
        "resetForm"
    );

const emailInput =
    document.getElementById(
        "email"
    );

const resetButton =
    document.getElementById(
        "resetButton"
    );

const successMessage =
    document.getElementById(
        "successMessage"
    );

const errorMessage =
    document.getElementById(
        "errorMessage"
    );


/* =================================
   SHOW SUCCESS
================================= */

function showSuccess(message){

    successMessage.textContent =
        message;

    successMessage.style.display =
        "block";

    errorMessage.style.display =
        "none";

}


/* =================================
   SHOW ERROR
================================= */

function showError(message){

    errorMessage.textContent =
        message;

    errorMessage.style.display =
        "block";

    successMessage.style.display =
        "none";

}


/* =================================
   CLEAR MESSAGES
================================= */

function clearMessages(){

    successMessage.style.display =
        "none";

    errorMessage.style.display =
        "none";

}


/* =================================
   SEND RESET LINK
================================= */

resetForm.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();

        clearMessages();


        const email =
            emailInput.value.trim();


        if(!email){

            showError(
                "Please enter your email address."
            );

            return;

        }


        resetButton.disabled =
            true;

        resetButton.textContent =
            "Sending...";


        /*
           After clicking the email link,
           Supabase will open reset-password.html
        */

        const redirectUrl =
            window.location.origin +
            window.location.pathname.replace(
                "forgot-password.html",
                "reset-password.html"
            );


        const {
            error
        } =
            await supabaseClient
            .auth
            .resetPasswordForEmail(
                email,
                {
                    redirectTo:
                        redirectUrl
                }
            );


        if(error){

            console.error(
                "Password reset error:",
                error
            );


            showError(
                error.message ||
                "Unable to send reset link. Please try again."
            );


            resetButton.disabled =
                false;

            resetButton.textContent =
                "Send Reset Link";

            return;

        }


        showSuccess(
            "Reset link sent successfully. Please check your email inbox."
        );


        emailInput.value =
            "";


        resetButton.disabled =
            false;

        resetButton.textContent =
            "Send Reset Link";

    }
);

</script>


</body>

</html>
