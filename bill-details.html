<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;

}


/* =================================
   HEADER
================================= */

.header{
    background:white;
    padding:18px 20px;
    border-bottom:1px solid #eee;
    display:flex;
    align-items:center;

    top:0;

.back{

.logo{

.logo span{
    color:#FF6B35;

/* =================================
   MAIN
================================= */

.container{
    width:100%;

}

.page-title{
    font-size:25px;
    margin-bottom:18px;
}


/* =================================
   LOADING
================================= */

.loading{
    background:white;
    border-radius:20px;
    padding:40px 20px;
    text-align:center;
    color:#888;
}


/* =================================
   ERROR
================================= */

.error-box{
    display:none;
    background:#fff1f1;
    color:#c62828;
    border-radius:15px;
    padding:16px;
    margin-bottom:15px;
    font-size:13px;

}


/* =================================
   PREVIEW
================================= */

.preview-card{
    background:white;
    border-radius:20px;
    padding:15px;
    margin-bottom:15px;
    box-shadow:0 4px 15px rgba(0,0,0,.05);
}

.preview{
    min-height:300px;
    background:#f1f1f1;
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    overflow:hidden;
}

.preview img{
    display:block;
    width:100%;
    max-height:600px;
    object-fit:contain;
    background:white;
}

.preview iframe{
    width:100%;
    height:600px;
    border:none;
    background:white;
}

.preview-placeholder{
    color:#888;
    padding:30px;
}

.preview-icon{
    font-size:55px;
    margin-bottom:12px;
}

.preview-placeholder p{
    font-size:13px;
    line-height:1.5;
}


/* =================================
   DETAILS
================================= */

.details-card{
    background:white;
    border-radius:20px;
    padding:20px;
    margin-bottom:15px;
    box-shadow:0 4px 15px rgba(0,0,0,.05);
}

.details-card h2{
    font-size:19px;
    margin-bottom:18px;
}

.detail-row{
    display:flex;
    justify-content:space-between;
    gap:15px;
    padding:13px 0;
    border-bottom:1px solid #eee;
}

.detail-row:last-child{
    border-bottom:none;
}

.label{
    color:#888;
    font-size:13px;
}

.value{
    font-size:14px;
    font-weight:700;
    text-align:right;
    word-break:break-word;
    max-width:65%;
}

.title-value{
    color:#181a1f;
    font-size:15px;
}

.amount{
    color:#FF6B35;
    font-size:20px;
    font-weight:900;
}

.category{
    background:#fff0e9;
    color:#FF6B35;
    padding:5px 9px;
    border-radius:7px;
    font-size:11px;
}


/* =================================
   STORAGE NOTE
================================= */

.storage-note{
    margin-top:15px;
    padding:12px;
    background:#fff7f3;
    border-radius:11px;
    color:#777;
    font-size:11px;
    line-height:1.5;
}


/* =================================
   ACTIONS
================================= */

.actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:15px;
}

.action{
    border:none;
    padding:14px;
    border-radius:12px;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
}

.action:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.download{
    background:#FF6B35;
    color:white;
}

.print{
    background:white;
    color:#333;
    border:1px solid #ddd;
}

.share{
    background:white;
    color:#FF6B35;
    border:1px solid #FF6B35;
}

.delete{
    background:#fff1f1;
    color:#d33;
    border:1px solid #ffd5d5;
}


/* =================================
   BACK
================================= */

.back-bills{
    display:block;
    text-align:center;
    color:#FF6B35;
    text-decoration:none;
    font-size:14px;
    font-weight:700;
    margin-top:20px;
}


/* =================================
   HIDDEN
================================= */

.hidden{
    display:none !important;
}


/* =================================
   PRINT
================================= */

@media print{

    .header,
    .actions,
    .back-bills,
    .error-box,
    .storage-note{
        display:none !important;
    }

    body{
        background:white;
    }

    .container{
        max-width:100%;
        padding:10px;
    }

    .preview-card,
    .details-card{
        box-shadow:none;
        border:1px solid #ddd;
    }

}


/* =================================
   MOBILE
================================= */

@media(max-width:480px){

    .container{
        padding:20px 15px;
    }

    .value{
        max-width:60%;
    }

}

</style>

  <script>

/* =================================
   SUPABASE
================================= */

const SUPABASE_URL =
    "https://fuymbbdnahkxnztlvdfr.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_OYnSR2D-1qDsyaeyxf6gzA_Odjs6Za3";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


/* =================================
   ELEMENTS
================================= */

const loadingBox =
    document.getElementById(
        "loadingBox"
    );


const billContent =
    document.getElementById(
        "billContent"
    );


const errorBox =
    document.getElementById(
        "errorBox"
    );


const preview =
    document.getElementById(
        "preview"
    );


const billTitle =
    document.getElementById(
        "billTitle"
    );


const shopName =
    document.getElementById(
        "shopName"
    );


const billDate =
    document.getElementById(
        "billDate"
    );


const totalAmount =
    document.getElementById(
        "totalAmount"
    );


const category =
    document.getElementById(
        "category"
    );


const fileType =
    document.getElementById(
        "fileType"
    );


const downloadButton =
    document.getElementById(
        "downloadButton"
    );


const deleteButton =
    document.getElementById(
        "deleteButton"
    );


/* =================================
   STATE
================================= */

let currentBill = null;

let currentFileUrl = null;


/* =================================
   GET BILL ID
================================= */

const urlParams =
    new URLSearchParams(
        window.location.search
    );


const billId =
    urlParams.get("id");


/* =================================
   SHOW ERROR
================================= */

function showError(
    text
){

    loadingBox.style.display =
        "none";


    billContent.classList.add(
        "hidden"
    );


    errorBox.textContent =
        text;


    errorBox.style.display =
        "block";

}


/* =================================
   DATE FORMAT
================================= */

function formatDate(
    dateString
){

    if(!dateString){
        return "-";
    }


    const parts =
        dateString.split("-");


    if(parts.length !== 3){
        return dateString;
    }


    const months = [

        "Jan",
        "Feb",
        "Mar",
        "Apr",
        "May",
        "Jun",
        "Jul",
        "Aug",
        "Sep",
        "Oct",
        "Nov",
        "Dec"

    ];


    return (

        parts[2] +
        " " +
        (
            months[
                Number(parts[1]) - 1
            ] || ""
        ) +
        " " +
        parts[0]

    );

}


/* =================================
   SAFE FILE TITLE
================================= */

function cleanFileName(
    value
){

    return String(
        value || "BillSafe"
    )
    .trim()
    .replace(
        /[^a-zA-Z0-9_-]+/g,
        "_"
    )
    .replace(
        /^_+|_+$/g,
        ""
    )
    .substring(
        0,
        80
    ) || "BillSafe";

}


/* =================================
   LOAD BILL
================================= */

async function loadBill(){

    if(!billId){

        showError(
            "Bill ID is missing."
        );

        return;

    }


    const {
        data:sessionData,
        error:sessionError
    } =
        await supabaseClient
        .auth
        .getSession();


    if(
        sessionError ||
        !sessionData ||
        !sessionData.session
    ){

        window.location.href =
            "login.html";

        return;

    }


    const user =
        sessionData.session.user;


    /* =============================
       LOAD ONLY CURRENT USER BILL
    ============================= */

    const {
        data,
        error
    } =
        await supabaseClient
        .from("bills")
        .select("*")
        .eq(
            "id",
            billId
        )
        .eq(
            "user_id",
            user.id
        )
        .maybeSingle();


    if(error){

        console.error(
            "Bill load error:",
            error
        );


        showError(
            "Unable to load this bill."
        );


        return;

    }


    if(!data){

        showError(
            "Bill not found or you do not have access to it."
        );


        return;

    }


    currentBill =
        data;


    /* =============================
       PAGE TITLE
    ============================= */

    document.title =
        (
            data.title ||
            "Bill Details"
        ) +
        " - BillSafe";


    /* =============================
       DISPLAY DETAILS
    ============================= */

    billTitle.textContent =
        data.title ||
        data.shop_name ||
        "Untitled Bill";


    shopName.textContent =
        data.shop_name ||
        "Not added";


    billDate.textContent =
        formatDate(
            data.bill_date
        );


    if(
        data.total_amount !== null &&
        data.total_amount !== undefined &&
        data.total_amount !== ""
    ){

        totalAmount.textContent =
            "₹" +
            Number(
                data.total_amount
            ).toFixed(2);

    }else{

        totalAmount.textContent =
            "Not added";

    }


    category.textContent =
        data.category ||
        "Not added";


    fileType.textContent =
        getReadableFileType(
            data.file_type
        );


    /* =============================
       PREVIEW
    ============================= */

    await createPreview(
        data
    );


    loadingBox.style.display =
        "none";


    billContent.classList.remove(
        "hidden"
    );

}


/* =================================
   FILE TYPE
================================= */

function getReadableFileType(
    type
){

    if(!type){
        return "Unknown";
    }


    const value =
        type.toLowerCase();


    if(
        value === "application/pdf" ||
        value.includes("pdf")
    ){

        return "PDF";

    }


    if(
        value.startsWith("image/")
    ){

        return "Image";

    }


    return type;

}


/* =================================
   SIGNED URL
================================= */

async function getSignedUrl(
    filePath
){

    if(!filePath){
        return null;
    }


    const {
        data,
        error
    } =
        await supabaseClient
        .storage
        .from("bills")
        .createSignedUrl(
            filePath,
            3600
        );


    if(error){

        console.error(
            "Signed URL error:",
            error
        );


        return null;

    }


    return (
        data &&
        data.signedUrl
    ) || null;

}


/* =================================
   CREATE PREVIEW
================================= */

async function createPreview(
    bill
){

    preview.innerHTML = `

        <div class="preview-placeholder">

            <div class="preview-icon">
                ⏳
            </div>

            <p>
                Loading bill preview...
            </p>

        </div>

    `;


    const url =
        await getSignedUrl(
            bill.file_path
        );


    if(!url){

        preview.innerHTML = `

            <div class="preview-placeholder">

                <div class="preview-icon">
                    🧾
                </div>

                <p>
                    Bill preview is unavailable.
                </p>

            </div>

        `;


        return;

    }


    currentFileUrl =
        url;


    const type =
        String(
            bill.file_type || ""
        ).toLowerCase();


    /* =============================
       IMAGE
    ============================= */

    if(
        type.startsWith("image/")
    ){

        const img =
            document.createElement(
                "img"
            );


        img.src =
            url;


        img.alt =
            bill.title ||
            "Saved Bill";


        img.onload =
            function(){

                preview.scrollIntoView({
                    behavior:"smooth",
                    block:"nearest"
                });

            };


        img.onerror =
            function(){

                preview.innerHTML = `

                    <div class="preview-placeholder">

                        <div class="preview-icon">
                            ⚠️
                        </div>

                        <p>
                            Unable to display this bill image.
                        </p>

                    </div>

                `;

            };


        preview.innerHTML =
            "";


        preview.appendChild(
            img
        );


        return;

    }


    /* =============================
       PDF
    ============================= */

    if(
        type === "application/pdf" ||
        type.includes("pdf")
    ){

        const iframe =
            document.createElement(
                "iframe"
            );


        iframe.src =
            url;


        iframe.title =
            bill.title ||
            "Bill PDF";


        iframe.loading =
            "lazy";


        preview.innerHTML =
            "";


        preview.appendChild(
            iframe
        );


        return;

    }


    /* =============================
       OTHER FILE
    ============================= */

    preview.innerHTML = `

        <div class="preview-placeholder">

            <div class="preview-icon">
                📄
            </div>

            <p>
                Preview is not available
                for this file type.
            </p>

        </div>

    `;

}


/* =================================
   GET DOWNLOAD EXTENSION
================================= */

function getFileExtension(
    bill
){

    const type =
        String(
            bill.file_type || ""
        ).toLowerCase();


    if(
        type.includes("pdf")
    ){

        return ".pdf";

    }


    if(
        type.includes("png")
    ){

        return ".png";

    }


    if(
        type.includes("webp")
    ){

        return ".webp";

    }


    if(
        type.includes("gif")
    ){

        return ".gif";

    }


    if(
        type.includes("jpeg") ||
        type.includes("jpg")
    ){

        return ".jpg";

    }


    /* Fallback from original file path */

    const path =
        String(
            bill.file_path || ""
        );


    const match =
        path.match(
            /\.([a-z0-9]+)$/i
        );


    if(match){

        return "." +
            match[1].toLowerCase();

    }


    return ".jpg";

}


/* =================================
   DOWNLOAD NAME
================================= */

function getDownloadName(
    bill
){

    const title =
        cleanFileName(
            bill.title ||
            bill.shop_name ||
            "KEEVO Bill"
        );


    const date =
        bill.bill_date ||
        "bill";


    const extension =
        getFileExtension(
            bill
        );


    return (
        title +
        "_" +
        date +
        extension
    );

}


/* =================================
   DOWNLOAD
================================= */

async function downloadBill(){

    if(!currentBill){
        return;
    }


    downloadButton.disabled =
        true;


    downloadButton.textContent =
        "Preparing...";


    try{

        const url =
            await getSignedUrl(
                currentBill.file_path
            );


        if(!url){

            throw new Error(
                "Unable to create secure download link."
            );

        }


        const response =
            await fetch(
                url
            );


        if(!response.ok){

            throw new Error(
                "Download failed."
            );

        }


        const blob =
            await response.blob();


        const blobUrl =
            URL.createObjectURL(
                blob
            );


        const link =
            document.createElement(
                "a"
            );


        link.href =
            blobUrl;


        link.download =
            getDownloadName(
                currentBill
            );


        link.style.display =
            "none";


        document.body.appendChild(
            link
        );


        link.click();


        link.remove();


        setTimeout(
            function(){

                URL.revokeObjectURL(
                    blobUrl
                );

            },
            1000
        );


    }catch(error){

        console.error(
            "Download error:",
            error
        );


        alert(
            "Unable to download this bill."
        );


    }finally{

        downloadButton.disabled =
            false;


        downloadButton.textContent =
            "⬇️ Download";

    }

}


/* =================================
   PRINT
================================= */

function printBill(){

    window.print();

}


/* =================================
   SHARE
================================= */

async function shareBill(){

    if(!currentBill){
        return;
    }


    const title =
        currentBill.title ||
        currentBill.shop_name ||
        "KEEVO Bill";


    const shareText =
        "KEEVO Bill\n" +
        "Title: " +
        title +
        "\nShop: " +
        (
            currentBill.shop_name ||
            "Not added"
        ) +
        "\nAmount: " +
        (
            currentBill.total_amount !== null &&
            currentBill.total_amount !== undefined &&
            currentBill.total_amount !== ""
            ? "₹" +
              Number(
                  currentBill.total_amount
              ).toFixed(2)
            : "Not added"
        ) +
        "\nDate: " +
        formatDate(
            currentBill.bill_date
        );


    /* =============================
       NATIVE SHARE
    ============================= */

    if(
        navigator.share
    ){

        try{

            await navigator.share({

                title:
                    title,

                text:
                    shareText

            });

        }catch(error){

            /*
              User cancelled sharing.
              Do nothing.
            */

            console.log(
                "Share cancelled:",
                error
            );

        }

        return;

    }


    /* =============================
       CLIPBOARD FALLBACK
    ============================= */

    try{

        await navigator.clipboard.writeText(
            shareText
        );


        alert(
            "Bill details copied. You can paste and share them."
        );


    }catch(error){

        alert(
            shareText
        );

    }

}


/* =================================
   DELETE BILL
================================= */

async function deleteBill(){

    if(!currentBill){
        return;
    }


    const confirmed =
        confirm(
            "Are you sure you want to delete this bill?\n\nThe saved bill file and its Keevo record will be deleted."
        );


    if(!confirmed){
        return;
    }


    deleteButton.disabled =
        true;


    deleteButton.textContent =
        "Deleting...";


    try{

        /* =========================
           STORAGE FILE REQUIRED
        ========================= */

        if(
            currentBill.file_path
        ){

            const {
                error:
                    storageError
            } =
                await supabaseClient
                .storage
                .from("bills")
                .remove([
                    currentBill.file_path
                ]);


            /*
              IMPORTANT:
              If Storage deletion fails,
              DO NOT delete the DB record.
            */

            if(storageError){

                console.error(
                    "Storage delete error:",
                    storageError
                );


                throw new Error(
                    "The bill file could not be deleted. Your bill record was kept safe."
                );

            }

        }


        /* =========================
           DELETE DATABASE RECORD
        ========================= */

        const {
            error:
                dbError
        } =
            await supabaseClient
            .from("bills")
            .delete()
            .eq(
                "id",
                currentBill.id
            )
            .eq(
                "user_id",
                currentBill.user_id
            );


        if(dbError){

            console.error(
                "Database delete error:",
                dbError
            );


            /*
              At this point the Storage file
              may already be deleted while
              the DB row remains.

              We intentionally don't pretend
              the operation fully succeeded.
            */

            throw new Error(
                "The bill file was deleted, but the database record could not be removed. Please contact support if it still appears."
            );

        }


        alert(
            "Bill deleted successfully."
        );


        window.location.href =
            "my-bills.html";


    }catch(error){

        console.error(
            "Delete bill error:",
            error
        );


        alert(
            error.message ||
            "Something went wrong while deleting the bill."
        );


    }finally{

        deleteButton.disabled =
            false;


        deleteButton.textContent =
            "🗑️ Delete";

    }

}


/* =================================
   START
================================= */

loadBill();

</script>
