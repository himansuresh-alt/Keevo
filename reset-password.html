<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#FF6B35"
>

<title>Reset Password - KEEVO</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f5f6f8;
    color:#181a1f;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:430px;
}

.logo{
    text-align:center;
    font-size:30px;
    font-weight:900;
    margin-bottom:8px;
}

.logo span{
    color:#FF6B35;
}

.subtitle{
    text-align:center;
    color:#777;
    font-size:14px;
    line-height:1.5;
    margin-bottom:25px;
}

.card{
    background:white;
    border-radius:20px;
    padding:25px 20px;
    box-shadow:0 6px 25px rgba(0,0,0,.06);
}

.icon{
    width:65px;
    height:65px;
    border-radius:50%;
    background:#fff0e9;
    display:flex;
    align-items:center;
    justify-content:center;
    margin:0 auto 18px;
    font-size:28px;
}

h1{
    text-align:center;
    font-size:22px;
    margin-bottom:8px;
}

.description{
    text-align:center;
    color:#777;
    font-size:13px;
    line-height:1.5;
    margin-bottom:22px;
}

label{
    display:block;
    font-size:13px;
    font-weight:700;
    margin-bottom:7px;
}

input{
    width:100%;
    padding:13px;
    border:1px solid #ddd;
    border-radius:11px;
    outline:none;
    font-size:14px;
    margin-bottom:14px;
}

input:focus{
    border-color:#FF6B35;
}

.reset-btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    background:#FF6B35;
    color:white;
    font-size:14px;
    font-weight:800;
    cursor:pointer;
}

.reset-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.message{
    display:none;
    padding:13px;
    border-radius:11px;
    font-size:13px;
    line-height:1.5;
    margin-bottom:15px;
}

.success{
    background:#eefaf1;
    color:#26733b;
}

.error{
    background:#fff1f1;
    color:#c62828;
}

.login-link{
    display:block;
    text-align:center;
    margin-top:18px;
    color:#FF6B35;
    text-decoration:none;
    font-size:13px;
    font-weight:700;
}

</style>

</head>


<body>


<div class="container">


    <div class="logo">
        KEEVO
    </div>


    <p class="subtitle">
        Keep every bill safe.
    </p>


    <div class="card">


        <div class="icon">
            🔑
        </div>


        <h1>
            Create New Password
        </h1>


        <p class="description">
            Enter a new password for your
            KEEVO account.
        </p>


        <!-- SUCCESS -->

        <div
            id="successMessage"
            class="message success"
        ></div>


        <!-- ERROR -->

        <div
            id="errorMessage"
            class="message error"
        ></div>


        <!-- PASSWORD FORM -->

        <form id="resetForm">


            <label for="password">
                New Password
            </label>


            <input
                type="password"
                id="password"
                placeholder="Enter new password"
                autocomplete="new-password"
                minlength="6"
                required
            >


            <label for="confirmPassword">
                Confirm New Password
            </label>


            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm new password"
                autocomplete="new-password"
                minlength="6"
                required
            >


            <button
                type="submit"
                class="reset-btn"
                id="resetButton"
            >
                Update Password
            </button>


        </form>


        <a
            href="login.html"
            class="login-link"
        >
            ← Back to Login
        </a>


    </div>


</div>


<script>

/* =================================
   SUPABASE
================================= */

const SUPABASE_URL =
    "https://fuymbbdnahkxnztlvdfr.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_OYnSR2D-1qDsyaeyxf6gzA_Odjs6Za3";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


/* =================================
   ELEMENTS
================================= */

const resetForm =
    document.getElementById(
        "resetForm"
    );

const passwordInput =
    document.getElementById(
        "password"
    );

const confirmPasswordInput =
    document.getElementById(
        "confirmPassword"
    );

const resetButton =
    document.getElementById(
        "resetButton"
    );

const successMessage =
    document.getElementById(
        "successMessage"
    );

const errorMessage =
    document.getElementById(
        "errorMessage"
    );


/* =================================
   SHOW SUCCESS
================================= */

function showSuccess(message){

    successMessage.textContent =
        message;

    successMessage.style.display =
        "block";

    errorMessage.style.display =
        "none";

}


/* =================================
   SHOW ERROR
================================= */

function showError(message){

    errorMessage.textContent =
        message;

    errorMessage.style.display =
        "block";

    successMessage.style.display =
        "none";

}


/* =================================
   CLEAR MESSAGES
================================= */

function clearMessages(){

    successMessage.style.display =
        "none";

    errorMessage.style.display =
        "none";

}


/* =================================
   CHECK RESET SESSION
================================= */

async function checkResetSession(){

    const {
        data,
        error
    } =
        await supabaseClient
        .auth
        .getSession();


    if(error){

        console.error(
            "Reset session error:",
            error
        );

        showError(
            "Unable to verify the password reset link."
        );

        resetButton.disabled =
            true;

        return;

    }


    if(
        !data ||
        !data.session
    ){

        showError(
            "This password reset link is invalid or expired. Please request a new reset link."
        );

        resetButton.disabled =
            true;

        return;

    }

}


/* =================================
   UPDATE PASSWORD
================================= */

resetForm.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();

        clearMessages();


        const password =
            passwordInput.value;

        const confirmPassword =
            confirmPasswordInput.value;


        /* PASSWORD LENGTH */

        if(
            password.length < 6
        ){

            showError(
                "Password must contain at least 6 characters."
            );

            return;

        }


        /* PASSWORD MATCH */

        if(
            password !==
            confirmPassword
        ){

            showError(
                "Passwords do not match."
            );

            return;

        }


        resetButton.disabled =
            true;

        resetButton.textContent =
            "Updating...";


        /* UPDATE PASSWORD */

        const {
            error
        } =
            await supabaseClient
            .auth
            .updateUser({
                password:
                    password
            });


        if(error){

            console.error(
                "Password update error:",
                error
            );


            showError(
                error.message ||
                "Unable to update password. Please try again."
            );


            resetButton.disabled =
                false;

            resetButton.textContent =
                "Update Password";

            return;

        }


        /* SUCCESS */

        showSuccess(
            "Password updated successfully. Redirecting to login..."
        );


        passwordInput.value =
            "";

        confirmPasswordInput.value =
            "";


        resetButton.disabled =
            true;

        resetButton.textContent =
            "Password Updated";


        setTimeout(
            function(){

                window.location.href =
                    "login.html";

            },
            2500
        );

    }
);


/* =================================
   START
================================= */

checkResetSession();

</script>


</body>

</html>
