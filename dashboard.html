<style>

/* =========================================
   RESET
========================================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

    background:#F7F7F6;

    color:#171717;

    min-height:100vh;

    padding-bottom:95px;

    -webkit-font-smoothing:antialiased;
}

a{
    -webkit-tap-highlight-color:transparent;
}

button{
    font-family:inherit;
}


/* =========================================
   APP
========================================= */

.app{
    width:100%;

    max-width:680px;

    margin:0 auto;

    min-height:100vh;

    background:#F7F7F6;

    overflow:hidden;
}


/* =========================================
   NATURAL HERO
========================================= */

.hero{

    position:relative;

    min-height:390px;

    overflow:hidden;

    background:
        #FFF8F1
        url("hero-nature.png")
        center top /
        cover
        no-repeat;
}


/* =========================================
   HERO SOFT OVERLAY
========================================= */

.hero::after{

    content:"";

    position:absolute;

    inset:0;

    background:
        linear-gradient(
            180deg,
            rgba(255,249,242,.20) 0%,
            rgba(255,249,242,.08) 42%,
            rgba(255,249,242,.50) 72%,
            rgba(255,249,242,.94) 100%
        );

    pointer-events:none;

    z-index:1;
}


/* =========================================
   HERO CONTENT
========================================= */

.hero-content{

    position:relative;

    z-index:5;

    padding:
        82px
        27px
        120px;
}

.hero-greeting{

    color:#5F5752;

    font-size:13px;

    font-weight:500;

    margin-bottom:3px;
}

.hero-name{

    color:#171717;

    font-size:31px;

    line-height:1.04;

    font-weight:900;

    letter-spacing:-1px;

    margin-bottom:9px;

    text-shadow:

}

.hero-subtitle{

    color:#625A55;

    font-size:13px;

    line-height:1.45;

    font-weight:500;
}


/* =========================================
   CONTENT
========================================= */

.content{

    position:relative;

    padding:

        17px
        30px;

    background:#F7F7F6;
}


/* =========================================
   TOTAL EXPENSE CARD
========================================= */

.expense-card{

    position:relative;

    overflow:hidden;

    border-radius:21px;

            #FF4D24

/* DECORATIVE CIRCLES */

.expense-card::before{

    content:"";

    position:absolute;

    width:150px;
    height:150px;

    border-radius:50%;

    right:-48px;
    top:-70px;

    background:
        rgba(255,255,255,.10);
}

.expense-card::after{

    content:"";

    position:absolute;

    width:100px;
    height:100px;

    border-radius:50%;

    right:60px;
    bottom:-70px;

    background:
        rgba(255,255,255,.07);
}


/* =========================================
   EXPENSE TOP
========================================= */

.expense-top{

    position:relative;

    z-index:5;

    display:flex;

    align-items:center;

    justify-content:space-between;
}

.expense-label{

    font-size:12px;

    opacity:.96;
}

.month-button{

    border-radius:18px;

    padding:
        8px
        12px;

    background:
        rgba(255,255,255,.83);

    color:#8E432D;

    font-size:9px;

    font-weight:800;
}


/* =========================================
   EXPENSE AMOUNT
========================================= */

.expense-amount{

    position:relative;

    z-index:5;

    font-size:31px;

    line-height:1;

    font-weight:900;

    letter-spacing:-.8px;

    margin-top:13px;
}

.expense-count{

    position:relative;

    z-index:5;

    margin-top:5px;

    font-size:10px;

    opacity:.90;

/* =========================================
   MINI CHART
========================================= */

.mini-chart{

    position:absolute;

    z-index:5;

    right:20px;

    bottom:17px;

    height:53px;

    display:flex;

    align-items:flex-end;

    justify-content:center;

    gap:5px;
}

.mini-chart span{

    border-radius:

    background:
        rgba(255,255,255,.78);
}

.mini-chart span:nth-child(1){

}

.mini-chart span:nth-child(2){
    height:38px;
}

.mini-chart span:nth-child(3){
    height:32px;
}

.mini-chart span:nth-child(4){

}


/* =========================================
   STATS
========================================= */

.stats{

        1fr

    gap:12px;

    margin-top:13px;

.stat-card{

.stat-icon{

    background:#EEF7FF;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:18px;
}

.stat-card:nth-child(2)

}

.stat-label{

    color:#777;

    font-size:11px;

    margin-bottom:7px;
}

.stat-value{

    font-weight:900;

    letter-spacing:-.4px;

    margin-bottom:5px;
}

.stat-note{

    color:#999;

    font-size:9px;

/* =========================================
   RECENT ACTIVITY
========================================= */

.recent-section{

    margin-top:25px;
}

.section-head{

    display:flex;

    justify-content:space-between;

.section-title{

.view-all{

/* =========================================

========================================= */

.activity-box{

.activity-row{

.activity-row:last-child{

}

.activity-icon{

.activity-info{

.activity-date{

.activity-amount{

.empty{

/* =========================================
   ERROR
========================================= */

    color:#C62828;

/* =========================================
   3D FLOATING BOTTOM NAVIGATION
========================================= */

.bottom-nav{

    left:14px;
    right:14px;
    bottom:12px;

    height:70px;

    background:

            145deg,
            #ffffff,

        inset 0 1px 0 rgba(255,255,255,.95),
        inset 0 -2px 5px rgba(0,0,0,.035);

    z-index:1000;
}


/* NAV ITEM */

.nav-item{
    width:20%;
    height:58px;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    gap:3px;

    text-decoration:none;

    color:#888;

    font-size:10px;
    font-weight:600;

    border-radius:18px;

    transition:
        transform .18s ease,
        color .18s ease;
}


/* ACTIVE */

.nav-item.active{
    color:#FF6B35;

    background:
        linear-gradient(
            145deg,
            #fff7f2,
            #ffffff

    box-shadow:
        inset 0 2px 4px rgba(255,107,53,.08),

/* ICON */

.nav-icon{
    width:25px;
    height:25px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:20px;
}


/* SVG */

.nav-icon svg{
    width:20px;
    height:20px;

    fill:none;

    stroke:currentColor;

    stroke-width:2;

    stroke-linecap:round;
    stroke-linejoin:round;
}


/* =========================================
   3D ADD BUTTON
========================================= */

.nav-add{
    position:relative;

    margin-top:-27px;

    height:70px;

    z-index:5;
}


.nav-add-circle{

    align-items:center;
    justify-content:center;

    color:#ffffff;

    font-size:30px;

        box-shadow .18s ease;
}


.nav-add-label{
    margin-top:3px;

    color:#777;

    font-size:10px;
    font-weight:600;
}


/* =========================================
   PRESS / 3D EFFECT
========================================= */

.nav-item:active{
    transform:translateY(2px) scale(.96);
}


.nav-add:active .nav-add-circle{
    transform:
        translateY(3px)
        scale(.94);

    box-shadow:
        0 4px 9px rgba(255,107,53,.22),
        inset 0 3px 5px rgba(120,40,10,.18);
}


/* =========================================

@media(max-width:360px){

    }

    .nav-icon svg{
        width:19px;
        height:19px;
    }

    .nav-add-circle{

        height:54px;
    }
}

/* =========================================

/* =========================================
   MONEY
========================================= */

function formatMoney(value){

    return "₹" +

        Number(
            value || 0
        ).toLocaleString(
            "en-IN",
            {
                minimumFractionDigits:2,
                maximumFractionDigits:2
            }
        );

}


/* =========================================
   HTML SAFETY
========================================= */

function escapeHtml(value){

    return String(
        value ?? ""
    )

    .replaceAll(
        "&",
        "&amp;"
    )

    .replaceAll(
        "<",
        "&lt;"
    )

    .replaceAll(
        ">",
        "&gt;"
    )

    .replaceAll(
        '"',
        "&quot;"
    )

    .replaceAll(
        "'",
        "&#039;"
    );

}


/* =========================================
   DATE
========================================= */

function formatDate(dateString){

    if(!dateString){

        return "";

    }


    const parts =
        dateString.split("-");


    if(parts.length !== 3){

        return dateString;

    }


    const months = [

        "Jan",
        "Feb",
        "Mar",
        "Apr",
        "May",
        "Jun",
        "Jul",
        "Aug",
        "Sep",
        "Oct",
        "Nov",
        "Dec"

    ];


    return (

        parts[2] +
        " " +
        (
            months[
                Number(parts[1]) - 1
            ] || ""
        ) +
        " " +
        parts[0]

    );

}


/* =========================================
   CATEGORY ICON
========================================= */

function getCategoryIcon(
    category
){

    const value =
        String(
            category || ""
        ).toLowerCase();


    if(
        value.includes("grocery")
    ){

        return "🥬";

    }


    if(
        value.includes("food")
    ){

        return "☕";

    }


    if(
        value.includes("petrol") ||
        value.includes("fuel")
    ){

        return "⛽";

    }


    if(
        value.includes("travel")
    ){

        return "🚕";

    }


    if(
        value.includes("shopping")
    ){

        return "🛒";

    }


    if(
        value.includes("medical") ||
        value.includes("health")
    ){

        return "💊";

    }


    if(
        value.includes("electric")
    ){

        return "⚡";

    }


    return "🧾";

}


/* =========================================
   GREETING
========================================= */

function setTimeGreeting(){

    const hour =
        new Date()
            .getHours();


    if(hour < 12){

        timeGreeting.textContent =
            "Good morning,";

    }
    else if(hour < 17){

        timeGreeting.textContent =
            "Good afternoon,";

    }
    else{

        timeGreeting.textContent =
            "Good evening,";

    }

}


/* =========================================
   ERROR
========================================= */

function showError(
    message
){

    errorBox.textContent =
        message;

    errorBox.style.display =
        "block";

}


function hideError(){

    errorBox.textContent =
        "";

    errorBox.style.display =
        "none";

}


/* =========================================
   SESSION CHECK
========================================= */

async function checkSession(){

    try{

        const {
            data,
            error
        } =
            await supabaseClient
                .auth
                .getSession();


        if(error){

            console.error(
                "Session error:",
                error
            );

            window.location.href =
                "login.html";

            return null;

        }


        if(
            !data ||
            !data.session ||
            !data.session.user
        ){

            window.location.href =
                "login.html";

            return null;

        }


        return data.session;

    }

    catch(error){

        console.error(
            "Session failed:",
            error
        );

        window.location.href =
            "login.html";

        return null;

    }

}


/* =========================================
   AUTH LISTENER
========================================= */

supabaseClient
    .auth
    .onAuthStateChange(
        function(event){

            if(
                event ===
                "SIGNED_OUT"
            ){

                window.location.href =
                    "login.html";

            }

        }
    );


/* =========================================
   LOAD USER
========================================= */

async function loadUser(
    user
){

    let fullName =
        "";


    try{

        const {
            data,
            error
        } =
            await supabaseClient
                .from("profiles")
                .select(
                    "full_name"
                )
                .eq(
                    "id",
                    user.id
                )
                .maybeSingle();


        if(
            !error &&
            data &&
            data.full_name
        ){

            fullName =
                data.full_name
                    .trim();

        }

    }
    catch(error){

        console.error(
            "Profile error:",
            error
        );

    }


    /* FALLBACK */

    if(!fullName){

        fullName =
            user.user_metadata?.full_name ||
            user.user_metadata?.name ||
            "User";

    }


    /* FIRST NAME */

    const firstName =
        fullName
            .split(/\s+/)[0];


    heroName.textContent =
        firstName +
        " 👋";


    setTimeGreeting();

}

    /* =========================================
   LOAD DASHBOARD
========================================= */

async function loadDashboard(){

    hideError();


    /* =====================================
       SESSION
    ===================================== */

    const session =
        await checkSession();


    if(!session){

        return;

    }


    const user =
        session.user;


    /* =====================================
       USER
    ===================================== */

    await loadUser(
        user
    );


    /* =====================================
       LOAD BILLS
       STORAGE ONLY
    ===================================== */

    const {
        data:bills,
        error:billsError
    } =
        await supabaseClient
            .from("bills")
            .select(
                "id,title,shop_name,bill_date,total_amount,category,created_at"
            )
            .eq(
                "user_id",
                user.id
            )
            .order(
                "bill_date",
                {
                    ascending:false
                }
            )
            .order(
                "created_at",
                {
                    ascending:false
                }
            );


    if(billsError){

        console.error(
            "Bills error:",
            billsError
        );


        showError(
            "Unable to load your saved bills."
        );

    }


    const allBills =
        bills || [];


    /* =====================================
       LOAD MY EXPENSES
       ONLY EXPENSE SOURCE
    ===================================== */

    const {
        data:expenses,
        error:expensesError
    } =
        await supabaseClient
            .from("daily_expenses")
            .select(
                "amount,expense_date,category,description"
            )
            .eq(
                "user_id",
                user.id
            )
            .order(
                "expense_date",
                {
                    ascending:false
                }
            );


    if(expensesError){

        console.error(
            "Expenses error:",
            expensesError
        );


        showError(
            "My Expenses could not be loaded."
        );

    }


    const allExpenses =
        expenses || [];


    /* =====================================
       TOTAL EXPENSE
    ===================================== */

    let total =
        0;


    allExpenses.forEach(
        function(item){

            total +=
                Number(
                    item.amount || 0
                );

        }
    );


    totalExpense.textContent =
        formatMoney(
            total
        );


    expenseCount.textContent =
        "from " +
        allExpenses.length +
        " expenses";


    /* =====================================
       TOTAL BILLS
    ===================================== */

    totalBills.textContent =
        allBills.length;


    /* =====================================
       THIS MONTH
    ===================================== */

    const now =
        new Date();


    const currentYear =
        now.getFullYear();


    const currentMonth =
        now.getMonth() + 1;


    let monthlyTotal =
        0;


    allExpenses.forEach(
        function(item){

            if(
                !item.expense_date
            ){

                return;

            }


            const parts =
                item.expense_date
                    .split("-");


            if(
                parts.length !== 3
            ){

                return;

            }


            const year =
                Number(parts[0]);


            const month =
                Number(parts[1]);


            if(
                year === currentYear &&
                month === currentMonth
            ){

                monthlyTotal +=
                    Number(
                        item.amount || 0
                    );

            }

        }
    );


    monthExpense.textContent =
        formatMoney(
            monthlyTotal
        );


    /* =====================================
       RECENT ACTIVITY
       EXPENSES ONLY
    ===================================== */

    renderRecentActivity(
        allExpenses.slice(
            0,
            5
        )
    );

}


/* =========================================
   RENDER RECENT ACTIVITY
========================================= */

function renderRecentActivity(
    expenses
){

    recentActivity.innerHTML =
        "";


    if(
        !expenses ||
        expenses.length === 0
    ){

        recentActivity.innerHTML = `

            <div class="empty">

                No expenses yet.

                <br><br>

                Add your first expense
                from My Expenses.

            </div>

        `;

        return;

    }


    expenses.forEach(
        function(item){

            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "activity-row";


            const category =
                item.category ||
                "Others";


            const description =
                item.description ||
                category;


            row.innerHTML = `

                <div class="activity-icon">

                    ${getCategoryIcon(
                        category
                    )}

                </div>


                <div class="activity-info">

                    <div class="activity-title">

                        ${escapeHtml(
                            description
                        )}

                    </div>


                    <div class="activity-date">

                        ${formatDate(
                            item.expense_date
                        )}

                    </div>

                </div>


                <div class="activity-amount">

                    ${formatMoney(
                        item.amount
                    )}

                </div>

            `;


            recentActivity.appendChild(
                row
            );

        }
    );

}


/* =========================================
   START
========================================= */

loadDashboard();

</script>
